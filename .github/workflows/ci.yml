# Lint and tests on pushes to main/master and on pull requests, the console
# package (dist/rgdsplus-charge-tune-<version>.zip) as a run artifact, and a
# GitHub release with that zip for every pushed v* tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # -eo pipefail: a failing `go test | tee` fails the step.
    shell: bash

env:
  # The console build uses GO_VERSION from docker/Dockerfile; keep the minor
  # version in step.
  GO_VERSION: '1.27.x'

jobs:
  test:
    name: Lint and unit tests
    # A fixed release, not ubuntu-latest: the SDL2 packages below are
    # installed by name, and a new Ubuntu may rename or replace them.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            third_party/gabagool/go.sum

      # cgo headers for go-sdl2.
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "::error::gofmt needed for:"
            echo "$files"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy -diff
          (cd third_party/gabagool && go mod tidy -diff)

      - name: go vet
        run: go vet ./... github.com/BrandonKowalski/gabagool/v2/...

      - name: Unit tests
        run: go test -race ./... github.com/BrandonKowalski/gabagool/v2/...

      # The menu icon is rendered from its SVG source; the PNG in the
      # repository must match it.
      - name: Icon up to date
        run: go run ./cmd/mkicon -check

  package:
    name: Package (linux/arm64)
    # Native arm64 runners are free for public repositories. Without them
    # (private repository), set the repository variable
    # PACKAGE_RUNNER=ubuntu-24.04: the build then runs under QEMU, much slower.
    runs-on: ${{ vars.PACKAGE_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags for `git describe`: the version shown in Settings → About.
          fetch-depth: 0

      # scripts/collect-licenses.sh runs `go list` on the host.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            third_party/gabagool/go.sum

      - uses: go-task/setup-task@v2

      - uses: docker/setup-qemu-action@v4
        if: runner.arch != 'ARM64'

      - uses: docker/setup-buildx-action@v4

      - name: Version
        id: version
        run: |
          version=$(git describe --tags --always --dirty)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=rgdsplus-charge-tune-$version" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: task package

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### RG DS Plus Charge Tune $VERSION"
            echo
            echo "- build image: $(cat build/arm64/BUILD_GLIBC)"
            echo "- binary needs: $(cat build/arm64/REQUIRED_GLIBC)"
            echo "- zip: $(du -h dist/rgdsplus-charge-tune-*.zip | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/rgdsplus-charge-tune-*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Unpacks the artifact wrapper, leaving dist/rgdsplus-charge-tune-<version>.zip.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      # The asset name carries the version (rgdsplus-charge-tune-v1.2.0.zip).
      # Tags with a suffix (v1.1.0-rc1) become pre-releases. The disclaimer
      # (the same as in README and the app's About screen) comes before the
      # generated notes.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DISCLAIMER: |
            **ALL ACTIONS ARE AT YOUR OWN RISK. THE DEVELOPER IS NOT RESPONSIBLE FOR ANY CONSEQUENCES.**
            The app rewrites the console's boot partition and lets the battery charge faster than the factory setting; keep the backups it makes.
        run: |
          flags=(--verify-tag --generate-notes --notes "$DISCLAIMER" --title "RG DS Plus Charge Tune $TAG")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/rgdsplus-charge-tune-*.zip "${flags[@]}"
